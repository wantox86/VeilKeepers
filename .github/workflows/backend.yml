name: Backend

on:
  push:
    paths: ['backend/**', 'infra/**', 'docker-compose.yml', '.env.example', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'infra/**', 'docker-compose.yml', '.env.example', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: change-me-root
          MYSQL_DATABASE: veilkeepers
          MYSQL_USER: veilkeepers
          MYSQL_PASSWORD: test-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pchange-me-root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
        env:
          VK_TEST_DSN: "veilkeepers:test-pass@tcp(127.0.0.1:3306)/veilkeepers?parseTime=true&timeout=5s"

      - name: Build
        run: go build ./...

      # Verification only — no push. Runs from the repo root because the
      # Dockerfile lives at backend/Dockerfile and needs the module context.
      - name: Build Docker image (verify only)
        working-directory: .
        run: docker build ./backend
